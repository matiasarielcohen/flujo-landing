<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Listo</title>
<meta name="robots" content="noindex, nofollow" />
<style>
  html,body{margin:0;height:100%;background:#171817;color:#fff;
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
  .b{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;}
  p{margin:0;font-size:15px;color:rgba(255,255,255,0.75);line-height:1.6;}
  a{color:#fff;}
</style>
</head>
<body>
<div class="b">
  <p>Listo, recibimos tus datos.<br><span id="fallback" hidden>Podés <a href="rueda-operaciones.html?ok=1">volver a tu diagnóstico</a>.</span></p>
</div>

<!-- ============================================================
     Página puente. Sirve para UNA sola cosa:

     El formulario de GoHighLevel vive dentro de un iframe. Cuando
     alguien lo envía, GHL redirige DENTRO de ese iframe — la página
     de afuera (la rueda) no se entera de nada.

     Configurando el "On Submit → Redirect URL" del form de GHL a
     esta página, este script le avisa a la rueda que el lead entró,
     y la rueda cierra el pop-up y abre el diagnóstico.

     En GHL: Sites → Forms → tu form → Settings → On Submit →
             Redirect to URL → https://flujo.com.ar/rueda-gracias.html
     ============================================================ -->
<script>
(function(){
  "use strict";
  var embedded = false;
  try { embedded = window.parent && window.parent !== window; } catch(e){}

  if(embedded){
    // Le avisamos a la rueda. Sin datos: el lead ya quedó guardado en GHL.
    try{ window.parent.postMessage({ type:"flujo-lead", lead:{} }, "*"); }catch(e){}
  } else {
    // Si alguien cae acá suelto, le damos una salida.
    document.getElementById("fallback").removeAttribute("hidden");
  }
})();
</script>
</body>
</html>
